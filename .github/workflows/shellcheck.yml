---
name: Spellcheck shell/bash stuff

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  call-shellcheck-workflow:
    uses: Element-Logic/github-workflows/.github/workflows/shellcheck.yml@main
    with:
      arguments: "`find ./ -type f -name '*lib'`"
